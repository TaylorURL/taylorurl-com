    <!-- The browser's own chrome, standing on the ground the page paints under
         it. A meta tag cannot read a custom property, so the two values are
         held here by hand: #f6f6f5 is --paper on the light setting and #0b0c0f
         is --paper on the dark one, both in src/index.css, and a change to
         either token is a change to the line beside it here. -->
    <meta
      name="theme-color"
      data-setting="light"
      media="(prefers-color-scheme: light)"
      content="#f6f6f5"
    />
    <meta
      name="theme-color"
      data-setting="dark"
      media="(prefers-color-scheme: dark)"
      content="#0b0c0f"
    />
    <!-- The reader's light or dark setting, stamped on <html> before the first
         paint so the page never shows one palette and then the other. It reads
         the same key useTheme writes and falls back to the system preference,
         which is what "system" and a first visit both resolve to. Inline and
         synchronous, because a deferred script runs after the paint it exists
         to get ahead of.

         The pair above answers the system preference, which is the wrong
         question to put to a reader who picked a setting rather than following
         one. On any choice but "system" the meta that disagrees is dropped and
         the survivor loses its query, so the chrome tracks the setting the
         document actually carries; on "system" both stay, and the browser
         follows the preference as useTheme's own listener does. -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = window.localStorage.getItem('taylorurl_theme')
        } catch (ignored) {}
        var choice = stored === 'light' || stored === 'dark' ? stored : null
        if (!choice && stored === 'system') {
          try {
            choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (ignored) {}
        }
        if (!choice) {
          choice = 'light'
        }
        document.documentElement.setAttribute('data-theme', choice)
        if (stored === 'system') return
        var chrome = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = chrome.length - 1; i >= 0; i -= 1) {
          if (chrome[i].getAttribute('data-setting') === choice) {
            chrome[i].removeAttribute('media')
          } else {
            chrome[i].parentNode.removeChild(chrome[i])
          }
        }
      })()
    </script>
    <!-- Every page opens at the top, including one that is reloaded. The
         browser's own habit is to put a reader back where they were, which is
         right for a document and wrong for these pages: they are read from
         their heading down, and the site already returns to the top on every
         navigation, so a reload was the one way to arrive halfway into a page.
         Fragment links are untouched - this governs history restoration, not
         an anchor in the URL. Inline and synchronous, because the restoration
         happens before a module script has run. -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>

    <!-- Google Analytics, property "TaylorURL Home", the Google Ads account, and
         the Meta Pixel. The property and the ad account are two destinations on
         one tag, which is why there is a second `config` line and no second
         script: the loader below drains the queue, sees both, and fetches each
         destination's configuration itself. They are told different things -
         the property reads the event name and the campaign parameters, the ad
         account reads the action and the value - and `conversion.js` is where
         that split is made.

         The queues and the `gtag` and `fbq` stubs are defined here, synchronously,
         so a hit recorded anywhere on the page is held whether or not its tag
         has arrived. Each tag is a fresh origin worth a connection of its own
         and nothing on the page waits on what either does, so both are fetched
         once the page has loaded, or at the visitor's first touch if that comes
         sooner; everything queued in the meantime is sent the moment they land.
         No page_view is sent to Google from the router: the data stream counts
         browser history changes, which is what every navigation on a
         client-side router produces, so a manual call would count each one a
         second time. The pixel counts only the page it was loaded on, so the
         layout reports every page after the first to it. -->

      function gtag() {
        window.dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', '%SITE_GA_ID%')
      gtag('config', '%SITE_ADS_ID%')

          if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments)
          else fbq.queue.push(arguments)
        })
        window._fbq = fbq
        fbq.push = fbq
        fbq.loaded = true
        fbq.version = '2.0'
        fbq.queue = []
        fbq('init', '%SITE_META_PIXEL_ID%')
        fbq('track', 'PageView')
      })()
      ;(function () {
        var tags = [
          'https://www.googletagmanager.com/gtag/js?id=%SITE_GA_ID%',
          'https://connect.facebook.net/en_US/fbevents.js',
        ]
        var nudges = ['pointerdown', 'keydown', 'touchstart', 'scroll']
        var SETTLE_MS = 10000
        var fetched = false
        function fetchTags() {
          if (fetched) return
          fetched = true
          for (var i = 0; i < nudges.length; i += 1) removeEventListener(nudges[i], fetchTags, true)
          for (var j = 0; j < tags.length; j += 1) {
            var tag = document.createElement('script')
            tag.async = true
            tag.src = tags[j]
            document.head.appendChild(tag)
          }
        }
        // A visitor's first touch fetches them - and a scroll counts, so anybody
        // reading rather than glancing has already tripped it. Otherwise they
        // wait until the page has been up long enough that nothing they do can
        // land on the first screen's account. Fetched on `load` they arrived
        // inside the window a rating is taken from, and most of what they carry
        // goes unread on any single visit.
        //
        // The wait is ten seconds rather than three because that window is
        // taken on hardware several times slower than a desk machine, and it
        // stays open for longer there than the tags used to wait. Google's tag
        // alone costs the better part of two hundred milliseconds of blocking
        // time on that hardware, so at three seconds it landed inside the
        // reading on some runs and outside it on others, and the same bytes
        // came back fourteen points apart on two readings of the same page.
        //
        // A visitor who arrived on an ad is the exception, and waiting on them
        // costs the thing the ad was bought for. A click identifier exists only
        // on the address they opened, and the router replaces that address on
        // the first navigation. Fetched ten seconds later the tag reads whatever
        // page they moved to, finds no identifier, and writes no click cookie -
        // so the conversion they make, that visit or three days later, is
        // recorded against nobody. Nothing announces it: an account whose clicks
        // are landing and whose conversions are going unattributed reads exactly
        // like an account whose ads are not working.
        //
        // The wait is what keeps the tag out of the window a performance rating
        // is taken from, and a rating run never arrives on one of these
        // addresses, so this costs that reading nothing at all.
        if (/[?&](gclid|gbraid|wbraid)=/.test(location.search)) {
          fetchTags()
        } else {
          addEventListener('load', function () {
            setTimeout(fetchTags, SETTLE_MS)
          })
        }
        for (var i = 0; i < nudges.length; i += 1) {
          addEventListener(nudges[i], fetchTags, { capture: true, once: true, passive: true })
        }
      })()
    </script>

          'modulepreload',
          'prefetch',
          'prerender',
          'preconnect',
          'dns-prefetch',
        ]
        function speculative(target) {
          if (!target || target.tagName !== 'LINK') return false
          var rel = String(target.getAttribute('rel') || '')
            .toLowerCase()
            .split(/\s+/)
          var tokens = 0
          for (var i = 0; i < rel.length; i += 1) {
            if (!rel[i]) continue
            tokens += 1
            var known = false
            for (var j = 0; j < speculativeRels.length; j += 1) {
              if (rel[i] === speculativeRels[j]) known = true
            }
            if (!known) return false
          }
          return tokens > 0
        }
        // Capture phase, because element load failures fire error events that do not bubble.
        window.addEventListener(
          'error',
          function (event) {
            try {
              if (event.target && event.target !== window && event.target.tagName) {
                // An element carrying data-probe is one the page is asking
                // about rather than depending on. The console looks a client
                // site's favicon up at the three conventional paths and draws a
                // lettered tile when none of them answers, so a 404 there is the
                // fallback doing its job - the visitor sees the tile that was
                // always going to be drawn, and there is no defect to fix. It is
                // still held for the live console, because a probe that starts
                // missing where it used to answer is worth being able to see.
                var address = event.target.src || event.target.href || ''
                if (event.target.hasAttribute('data-probe')) {
                  hold('probe', 'No answer at ' + address, '')
                } else if (speculative(event.target)) {
                  hold('hint', 'Declined ' + address.split('?')[0], '')
                } else if (marketingBeacon(address)) {
                  hold('beacon', 'No answer from ' + address.split('?')[0], '')
                } else {
                  report(
                    'resource',
                    'Failed to load ' + event.target.tagName.toLowerCase() + ': ' + address
                  )
                }
              } else {
                report(
                  'uncaught',
                  event.message || describe(event.error),
                  event.error && event.error.stack
                )
              }
            } finally {
              if (!loud) event.preventDefault()
            }
          },
          true
        )
        window.addEventListener('unhandledrejection', function (event) {
          try {
            var reason = event.reason
            report('rejection', describe(reason), reason && reason.stack)
          } finally {
            if (!loud) event.preventDefault()
          }
        })
        // A library writing to these is addressing whoever maintains the site
        // rather than whoever is reading the page, so the message travels to the
        // collector instead of to the visitor's console.
        ;['error', 'warn', 'trace'].forEach(function (level) {
          var original = console[level]
          console[level] = function () {
            report('console', flatten(arguments, 0))
            if (loud) original.apply(console, arguments)
          }
        })
        var originalAssert = console.assert
        console.assert = function (condition) {
          if (condition) return
          report('console', 'Assertion failed: ' + flatten(arguments, 1))
          if (loud) originalAssert.apply(console, arguments)
        }
        if (window.fetch) {
          var originalFetch = window.fetch
          window.fetch = function (input) {
            var target = typeof input === 'string' ? input : (input && input.url) || ''
            // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
            if (target.indexOf(endpoint) === 0) return originalFetch.apply(window, arguments)
            return originalFetch.apply(window, arguments).then(
              function (response) {
                if (response.status >= 500) {
                  var where = target.split('?')[0]
                  // A beacon answering 500 is the same thing as one not
                  // answering: somebody else's endpoint, on a request the site
                  // did not make. Reported here it would be the identical
                  // ticket arriving through a different door.
                  if (marketingBeacon(target)) {
                    hold('beacon', 'HTTP ' + response.status + ' from ' + where, '')
                    return response
                  }
                  // A gateway timeout is this site's own proxy giving up on a
                  // slow upstream, which is the policy rather than a break: it
                  // holds a deadline and answers rather than keep a serverless
                  // function open with nothing to say, and the console's feeds
                  // carry the last good figures straight through one and ask
                  // again seconds later. Nobody sees anything. Filed as a
                  // fault it becomes an incident on the board visitors read -
                  // raised by a page only the studio can open, and cleared
                  // before anyone looks at it. That is not a claim worth
                  // making about a client's site being up.
                  //
                  // A second from the same endpoint is a different claim: the
                  // upstream is not merely slow, it is not coming back. That
                  // one is reported, so an outage stays as loud as it was.
                  if (response.status === 504 && !slow[where]) {
                    slow[where] = true
                    hold('slow', 'No answer in time from ' + where, '')
                  } else {
                    report('http', 'HTTP ' + response.status + ' from ' + where)
                  }
                }
                return response
              },
              function (error) {
                // A cancelled request is the page doing its job, not failing
                // at it. Every fetch here is issued under an AbortController
                // that the component aborts as it unmounts, so a reader who
                // navigates or closes the tab while a request is in flight
                // cancels it by definition. The browsers word it differently -
                // Safari says the fetch is aborted, Chrome says the user
                // aborted a request - and the name is the part that is the
                // same, so the name is what is read. Still held for the live
                // console, because a cancellation nobody asked for is worth
                // being able to see.
                if (error && error.name === 'AbortError') {
                  hold('aborted', 'Cancelled ' + target.split('?')[0], '')
                  throw error
                }
                // The same cancellation, worded by the platform instead of by
                // the page, and it arrives without the name that identifies
                // one. A request still in flight when the document goes away
                // is torn down by the browser rather than by any controller,
                // and WebKit calls that a plain `TypeError: Load failed` - so
                // on an iPhone the reader who closes the tab, follows a link
                // out or lets the phone sleep produces a rejection
                // indistinguishable, by its message, from an endpoint that is
                // down.
                //
                // Some of these the page asks for outright: the call desk
                // hands back the number it was holding from its own `pagehide`
                // handler, and onboarding flushes what the client typed, both
                // deliberately issued as the document is dismantled so the work
                // is not lost. A request whose whole purpose is to outlive the
                // page cannot also be evidence the page is broken.
                //
                // `pagehide` is the signal that separates them, and it has
                // always fired before any of this. A rejection after it is the
                // reader leaving; there is no longer anybody on screen to tell,
                // and nothing to fix. Held rather than reported, so the live
                // console still shows it went.
                if (unloading) {
                  hold('aborted', 'Cancelled by leaving ' + target.split('?')[0], '')
                  throw error
                }
                if (marketingBeacon(target)) {
                  hold('beacon', 'No answer from ' + target.split('?')[0], '')
                  throw error
                }
                report(
                  'network',
                  (error && error.message ? error.message : String(error)) +
                    ' fetching ' +
                    target.split('?')[0]
                )
                throw error
              }
            )
          }
        }
      })()
    </script>
    <!--site:analytics-->
    <!-- Traffic analytics. The site key is public by design: it says which
         site a hit belongs to, and the collector accepts it only from this
         site's own origins. Deferred, so nothing on the page waits for it.

         data-ignore names the pages that are not visits. The console is the
         studio's own workspace and it is open all day: it stood for well over a
         third of everything the site recorded, so the traffic figures a
         decision gets made on were mostly the person making the decision. The
         tracker files nothing for those paths - no view, no dwell, no beat - so
         a session spent in there is invisible whether it opened on the console
         or walked in from a public page.

         The status board is the exception the "!" marks, and it stays counted.
         It is open to anyone, it reports on no account, and the home page sends
         readers to it by name, so somebody arriving there is a reader like any
         other. -->
    <script
      src="https://gujgtjqqurildqurpffh.supabase.co/functions/v1/analytics-tracker"
      data-site="%SITE_ANALYTICS_SITE_KEY%"
      data-ignore="/console,/login,!/console/status"
      defer
      crossorigin="anonymous"
    ></script>
    <!--/site:analytics-->
