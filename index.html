    <!-- The blog's feed, written at build time from the same route list as the
         sitemap. Site-wide rather than per-route: the prerender reuses this head
         on every page it writes, so a reader can subscribe from wherever they
         happen to have landed. -->
    <!--site:blog-->
    <link rel="alternate" type="application/rss+xml" title="%SITE_FEED_TITLE%" href="/feed.xml" />
    <!--/site:blog-->
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- The browser's own chrome, standing on the ground the page paints under
         it. A meta tag cannot read a custom property, so the two values are
         held here by hand: #f6f6f5 is --paper on the light setting and #0b0c0f
         is --paper on the dark one, both in src/index.css, and a change to
         either token is a change to the line beside it here. -->
    <meta
      name="theme-color"
      data-setting="light"
      media="(prefers-color-scheme: light)"
      content="#f6f6f5"
    />
    <meta
      name="theme-color"
      data-setting="dark"
      media="(prefers-color-scheme: dark)"
      content="#0b0c0f"
    />
    <!-- The reader's light or dark setting, stamped on <html> before the first
         paint so the page never shows one palette and then the other. It reads
         the same key useTheme writes and falls back to the system preference,
         which is what "system" and a first visit both resolve to. Inline and
         synchronous, because a deferred script runs after the paint it exists
         to get ahead of.

         The pair above answers the system preference, which is the wrong
         question to put to a reader who picked a setting rather than following
         one. On any choice but "system" the meta that disagrees is dropped and
         the survivor loses its query, so the chrome tracks the setting the
         document actually carries; on "system" both stay, and the browser
         follows the preference as useTheme's own listener does. -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = window.localStorage.getItem('taylorurl_theme')
        } catch (ignored) {}
        var choice = stored === 'light' || stored === 'dark' ? stored : null
        if (!choice && stored === 'system') {
          try {
            choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (ignored) {}
        }
        if (!choice) {
          choice = 'light'
        }
        document.documentElement.setAttribute('data-theme', choice)
        if (stored === 'system') return
        var chrome = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = chrome.length - 1; i >= 0; i -= 1) {
          if (chrome[i].getAttribute('data-setting') === choice) {
            chrome[i].removeAttribute('media')
          } else {
            chrome[i].parentNode.removeChild(chrome[i])
          }
        }
      })()
    </script>
    <!-- Every page opens at the top, including one that is reloaded. The
         browser's own habit is to put a reader back where they were, which is
         right for a document and wrong for these pages: they are read from
         their heading down, and the site already returns to the top on every
         navigation, so a reload was the one way to arrive halfway into a page.
         Fragment links are untouched - this governs history restoration, not
         an anchor in the URL. Inline and synchronous, because the restoration
         happens before a module script has run. -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>
    <!--site:adTracking-->
    <!-- Google Analytics, property "TaylorURL Home", the Google Ads account, and
         the Meta Pixel. The property and the ad account are two destinations on
         one tag, which is why there is a second `config` line and no second
         script: the loader below drains the queue, sees both, and fetches each
         destination's configuration itself. They are told different things -
         the property reads the event name and the campaign parameters, the ad
         account reads the action and the value - and `conversion.js` is where
         that split is made.

         The queues and the `gtag` and `fbq` stubs are defined here, synchronously,
         so a hit recorded anywhere on the page is held whether or not its tag
         has arrived. Each tag is a fresh origin worth a connection of its own
         and nothing on the page waits on what either does, so both are fetched
         once the page has loaded, or at the visitor's first touch if that comes
         sooner; everything queued in the meantime is sent the moment they land.
         No page_view is sent to Google from the router: the data stream counts
         browser history changes, which is what every navigation on a
         client-side router produces, so a manual call would count each one a
         second time. The pixel counts only the page it was loaded on, so the
         layout reports every page after the first to it. -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        window.dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', '%SITE_GA_ID%')
      gtag('config', '%SITE_ADS_ID%')
      ;(function () {
        var fbq = (window.fbq = function () {
          if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments)
          else fbq.queue.push(arguments)
        })
        window._fbq = fbq
        fbq.push = fbq
        fbq.loaded = true
        fbq.version = '2.0'
        fbq.queue = []
        fbq('init', '%SITE_META_PIXEL_ID%')
        fbq('track', 'PageView')
      })()
      ;(function () {
        // Google's tag is asked for in CORS mode. Meta's cannot be.
        //
        // A throw inside a script from another origin is muted unless that
        // script was fetched with `crossorigin`: the browser replaces the
        // message with "Script error.", blanks the file, zeroes the line and
        // withholds the error object. Fetched with it, the same throw arrives
        // whole, and that is the difference between a report naming a file and
        // one naming nothing at all.
        //
        // It is set per tag rather than on both, because the attribute is not
        // free - a script fetched in CORS mode whose reply carries no
        // `Access-Control-Allow-Origin` is blocked outright. Asked with an
        // `Origin` header, `googletagmanager.com/gtag/js` reflects the origin
        // back and loads; `connect.facebook.net/en_US/fbevents.js` sends no
        // such header at all and is refused. Both checked in a browser against
        // the live vendors on 2026-09-10.
        //
        // So setting it on Meta's would take the pixel off the site, and it
        // would go the worst way there is: the tag never arrives, nothing
        // throws, and an account recording no events reads exactly like an
        // audience nobody reached. Whoever tidies this into one flag later will
        // find that out from the ads account weeks afterwards.
        var tags = [
          { src: 'https://www.googletagmanager.com/gtag/js?id=%SITE_GA_ID%', cors: true },
          { src: 'https://connect.facebook.net/en_US/fbevents.js', cors: false },
        ]
        var nudges = ['pointerdown', 'keydown', 'touchstart', 'scroll']
        var SETTLE_MS = 10000
        var fetched = false
        function fetchTags() {
          if (fetched) return
          fetched = true
          for (var i = 0; i < nudges.length; i += 1) removeEventListener(nudges[i], fetchTags, true)
          for (var j = 0; j < tags.length; j += 1) {
            var tag = document.createElement('script')
            tag.async = true
            if (tags[j].cors) tag.crossOrigin = 'anonymous'
            tag.src = tags[j].src
            document.head.appendChild(tag)
          }
        }
        // A visitor's first touch fetches them - and a scroll counts, so anybody
        // reading rather than glancing has already tripped it. Otherwise they
        // wait until the page has been up long enough that nothing they do can
        // land on the first screen's account. Fetched on `load` they arrived
        // inside the window a rating is taken from, and most of what they carry
        // goes unread on any single visit.
        //
        // The wait is ten seconds rather than three because that window is
        // taken on hardware several times slower than a desk machine, and it
        // stays open for longer there than the tags used to wait. Google's tag
        // alone costs the better part of two hundred milliseconds of blocking
        // time on that hardware, so at three seconds it landed inside the
        // reading on some runs and outside it on others, and the same bytes
        // came back fourteen points apart on two readings of the same page.
        //
        // A visitor who arrived on an ad is the exception, and waiting on them
        // costs the thing the ad was bought for. A click identifier exists only
        // on the address they opened, and the router replaces that address on
        // the first navigation. Fetched ten seconds later the tag reads whatever
        // page they moved to, finds no identifier, and writes no click cookie -
        // so the conversion they make, that visit or three days later, is
        // recorded against nobody. Nothing announces it: an account whose clicks
        // are landing and whose conversions are going unattributed reads exactly
        // like an account whose ads are not working.
        //
        // The wait is what keeps the tag out of the window a performance rating
        // is taken from, and a rating run never arrives on one of these
        // addresses, so this costs that reading nothing at all.
        if (/[?&](gclid|gbraid|wbraid)=/.test(location.search)) {
          fetchTags()
        } else {
          addEventListener('load', function () {
            setTimeout(fetchTags, SETTLE_MS)
          })
        }
        for (var i = 0; i < nudges.length; i += 1) {
          addEventListener(nudges[i], fetchTags, { capture: true, once: true, passive: true })
        }
      })()
    </script>

    <script>
      ;(function () {
        // The collector the rest of the fleet already reports to. This page
        // posted to a Supabase Edge Function instead, and that function is gone:
        // the route answers 404 to OPTIONS and POST alike, while another
        // function on the same project answers 200, so what was removed was the
        // function rather than the project, the key or the gateway. Every error
        // this site threw was discarded at the edge for as long as that URL
        // stood, which is why the ticket queue has never once carried a fault
        // against this site while the client sites file against theirs daily.
        // Nothing announces that. An empty queue reads exactly like a clean
        // night, so the next quiet stretch should be checked against this
        // endpoint before it is believed.
        var endpoint = 'https://sunday.tail1f78d7.ts.net/report'
        var site = '%SITE_ERROR_LABEL%'
        var sent = 0

        // error is reported first and swallowed second, so the report is made
        // whether or not the suppression holds. What survives is written by the
        // browser's own network layer, which no page script can reach.
        var loud = false
        var held = []
        // Which endpoints have already answered that they ran out of time. The
        // first one is not a fault; a second from the same place is.
        var slow = {}
        try {
          if (location.search.indexOf('console=on') > -1)
            localStorage.setItem('reporter-console', '1')
          if (location.search.indexOf('console=off') > -1)
            localStorage.removeItem('reporter-console')
          loud = localStorage.getItem('reporter-console') === '1'
        } catch (ignored) {}
        // Fields worth naming in a report, read by name rather than enumerated.
        // A DOM event, a DOMException and most host objects keep their data on
        // the prototype, where JSON.stringify cannot see it.
        var detailFields = [
          'name',
          'type',
          'message',
          'code',
          'status',
          'filename',
          'lineno',
          'colno',
        ]
        function detailOf(value) {
          var parts = []
          for (var i = 0; i < detailFields.length; i += 1) {
            var key = detailFields[i]

        // else - so on every Safari and every iPhone, filing the stack files an
        // address and no account of what happened at it.
        //

        // reported content was one frame, over an Error the boot had built a
        // sentence for. It names which of the three failures it was and repeats
        // what the engine said, the ticket title is drawn from the message, and
        // the queue got `@taylor.website`. Nothing announces it either, because
        // the same fault off Chrome arrives complete - the reporter looks
        // correct on the machine it is read on and is empty on half the traffic.

        // message to group on, no file to open and no stack to read - and there
        // never will be, because the muting is the browser's policy rather than
        // a detail this page dropped.
        //
        // Nothing this site serves can arrive that way. Its own bundle is
        // same-origin and the build marks it `crossorigin` besides, the
        // analytics tracker carries the attribute, and Google's tag is asked for
        // with it above, so all three report what they throw in full. What is
        // left able to mute is Meta's pixel, which no attribute can unmute
        // because its reply carries no CORS header, and whatever an extension or
        // an in-app browser's host has injected. None of those three is the
        // site's code and none of them is fixable here.
        //
        // Filed, it is a ticket with nothing in it: #524 came off `/start` on
        // 2026-09-10, opened from an ad inside an Android in-app browser, and
        // said "Script error." and not one thing more. Nor does it ever
        // accumulate into something clearer - every recurrence is the identical
        // empty message, so it groups with itself forever and reads as one fault
        // nobody has diagnosed rather than as a class of thing that cannot be.

        // asked for with the attribute, and that is not a bug in either. The
        // tag's own code appends further scripts once it runs, this page does

        // reach - six tickets off a single page load on 2026-09-10, every one
        // of them a userscript in the visitor's browser narrating itself in a
        // language the site does not publish in.
        //

        // strips the frame that captured it. That frame is always the wrapper,
        // which sits in this document and would put a site URL in front of the
        // test every single time - the filter would stay inert with a stack in
        // hand, which is worse than having none. It is found rather than
        // counted from the top, because V8 heads a stack with the error itself
        // and JSC starts straight in on the frames.
        //
        // What is left is the caller, and the question is the one the site
        // already knows how to answer. Nothing the site logs can be lost here:
        // its own code is served from this origin, never from an extension
        // one, so a site frame survives the strip and reports as it always has.
        function callerFrames(stack) {
          var lines = String(stack || '').split('\n')
          for (var i = 0; i < lines.length; i += 1) {
            if (lines[i].indexOf('://') > -1) return lines.slice(i + 1).join('\n')
          }
          return ''
        }
        // The site's tags fan out to endpoints the site never names. It writes
        // one script tag for Google's tag library and one for the Meta pixel,
        // and the vendor's script does the rest: the conversion beacon at
        // doubleclick, the remarketing pixel, the pixel's own collector. Those
        // requests render nothing, and they are the most blocked traffic on the
        // web - every content blocker, privacy extension and filtered corporate
        // network drops them, a mail scanner detonating a link tears them down
        // mid-flight, and Google's and Meta's own crawlers refuse them outright
        // so that crawling a landing page cannot bank a conversion nobody made.
        // A failure there describes the network the page was opened on. It is
        // not the site's to answer for and could not be fixed here if it were:
        // the site does not choose the URL, issue the request or read the
        // reply. Filed as faults they were nine separate tickets on
        // 2026-09-08, ruled out one at a time, against a site that was working.
        //
        // The loaders are deliberately not in here. `googletagmanager.com` and
        // `connect.facebook.net` are tags this page writes itself, so those
        // failing is the site's own wiring and stays reported. Held either way,
        // because a beacon that starts failing where it used to answer is worth
        // being able to see from the live console.
        var beaconHosts = [
          'doubleclick.net',
          'googleadservices.com',
          'googlesyndication.com',
          'google-analytics.com',
          'analytics.google.com',
        ]
        // The two that are also ordinary destinations the site links to, where
        // the path is the only thing separating a beacon from a link.
        //
        // `/g/collect` is the measurement hit itself. It normally goes to
        // `google-analytics.com`, which is named above and so never arrived
        // here - but with Google Signals on, the tag sends the same hit to
        // `www.google.com` as well, and that copy is the one that reaches this
        // list. It is the identical beacon wearing a hostname the site does
        // link to, which is what put a blocked analytics hit through as a site
        // fault while its twin an hour earlier was classified correctly.
        var beaconPaths = {
          'google.com': ['/pagead', '/ccm', '/rmkt', '/ads', '/g/collect'],
          'facebook.com': ['/tr'],
        }
        function marketingBeacon(address) {
          var host, path
          try {
            var parsed = new URL(String(address || ''), location.href)
            host = parsed.hostname.toLowerCase()
            path = parsed.pathname
          } catch (ignored) {
            return false
          }
          for (var i = 0; i < beaconHosts.length; i += 1) {
            var domain = beaconHosts[i]
            if (host === domain || host.slice(-(domain.length + 1)) === '.' + domain) return true
          }
          var paths = beaconPaths[host.replace(/^www\./, '')]
          if (paths) {
            for (var j = 0; j < paths.length; j += 1) {
              if (path === paths[j] || path.indexOf(paths[j] + '/') === 0) return true
            }
          }
          return false
        }
        // A request the page makes writes its own failure to the console when it
        // fails, and a collector that cannot be reached would then be the loudest
        // thing on the page. The same request issued inside a worker writes
        // nothing, so reports travel that way while the page is alive.
        var unloading = false
        var worker = null
        var workerFailed = false
        function transport() {
          if (worker || workerFailed) return worker
          try {
            var source =
              "self.onmessage=function(e){fetch(e.data.endpoint,{method:'POST',body:e.data.body}).then(function(){},function(){})}"
            worker = new Worker(
              URL.createObjectURL(new Blob([source], { type: 'text/javascript' }))
            )
          } catch (ignored) {
            workerFailed = true
          }
          return worker
        }
        function send(body) {
          // On the way out the worker dies with the page, and the console goes
          // with it, so the beacon's survival is worth more than its silence.
          if (!unloading) {
            var channel = transport()
            if (channel) {
              channel.postMessage({ endpoint: endpoint, body: body })
              return
            }
          }
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, body)
          } else {
            fetch(endpoint, { method: 'POST', body: body, keepalive: true }).catch(function () {})
          }
        }
        addEventListener('pagehide', function () {
          unloading = true
        })
        // And back again. A page frozen into the back/forward cache fired
        // `pagehide` and then did not go anywhere, so a document being shown
        // is a document alive: it has a console to write to and a reader to
        // answer for, and both are read off this flag.
        addEventListener('pageshow', function () {
          unloading = false
        })
        // Everything swallowed stays readable on the page itself, so a live
        // console with the flag off still answers what happened.
        function hold(kind, message, stack) {
          if (held.length < 50)
            held.push({ kind: kind, message: String(message), stack: String(stack || '') })
        }
        window.__reporter = {
          held: held,
          replay: function () {
            return held.slice()
          },
        }
        // The attempt number this page hung on an address of its own, taken
        // back off before the failure is filed under it.
        //
        // Asking for something a second time means asking at an address the
        // browser holds no rejection against, so both retries on this site
        // number a query rather than repeat a URL: `lazyWithRetry` for a chunk,
        // the capture frames for a portfolio shot. The number is this
        // document's own bookkeeping, it counts every retried address the page
        // has spent rather than the attempt at this one, and it never repeats.
        //
        // Which makes it the worst thing that can be in a filed message. What
        // is collected is grouped by what the message says, so an address
        // carrying a number that has never been seen before is a fault that has
        // never been seen before: one lost file arrives as several unrelated
        // faults, none of them ever meets the first attempt's report, and a
        // fault recurring for weeks is filed forever as a first sighting with
        // no recurrence ever counted against it. A refused capture on the home
        // page is six reports under three names, and a chunk a deploy has taken
        // files a fresh one on every pass.
        //
        // So the marker comes off, and what travels is the address the build
        // wrote - the same for the first attempt and the fourth, and the same
        // again for the pass after them. Nothing stops being reported: the
        // failures are all still sent, they are simply all still the one fault.
        //
        // This site's own addresses only. `retry` on somebody else's URL is
        // their parameter and means whatever they say it does.
        function settled(text) {
          return String(text).replace(/https?:\/\/[^\s'"<>)]+/gi, function (address) {
            if (address.indexOf('retry=') < 0) return address
            try {
              var parsed = new URL(address, location.href)
              if (parsed.origin !== location.origin) return address
              parsed.searchParams.delete('retry')
              return parsed.href
            } catch (ignored) {
              return address
            }
          })
        }
        function report(kind, message, stack) {
          // Held raw, filed settled. The live console is being read by somebody
          // asking which attempt this was, and that is exactly the detail the
          // collector has to lose to see two attempts as one fault.
          hold(kind, message, stack)
          if (sent >= 10) return // a page stuck in an error loop stops at ten
          if (extensionOnly(stack)) return
          sent += 1
          try {
            send(
              JSON.stringify({
                site: site,
                kind: kind,
                message: settled(message || 'Unknown error').slice(0, 1500),
                stack: settled(stack || '').slice(0, 4000),
                url: location.href,
                userAgent: navigator.userAgent,
              })
            )
          } catch (ignored) {}
        }
        function flatten(args, from) {
          var parts = []
          for (var i = from; i < args.length; i += 1) {
            parts.push(describe(args[i]))
          }
          return parts.join(' ')
        }
        // A hint is an offer, and the browser is free to turn it down.
        // `preload`, `modulepreload` and `prefetch` say the page would like
        // something fetched early; they do not say the page depends on it. A
        // renderer short of time or bandwidth declines them by the dozen, and a
        // crawler declines almost all of them - being the first thing dropped
        // when something has to give is what a hint is for.
        //
        // Declining one fires exactly the `error` event a real failure fires,
        // and nothing has been lost when it does: whatever the hint named is
        // still asked for by the `@font-face` rule, the stylesheet link or the
        // import that actually needs it, and that request reports for itself if
        // it genuinely fails. Filing the hint as well accuses a file that is
        // answering, which is how a crawler dropping its module preloads
        // arrived as a page whose scripts had gone missing.
        //
        // Read as all-or-nothing, because `rel` carries a list: a link that is
        // also a `stylesheet` is a real dependency wearing a hint, and it keeps
        // reporting.
        var speculativeRels = [
          'preload',
          'modulepreload',
          'prefetch',
          'prerender',
          'preconnect',
          'dns-prefetch',
        ]
        function speculative(target) {
          if (!target || target.tagName !== 'LINK') return false
          var rel = String(target.getAttribute('rel') || '')
            .toLowerCase()
            .split(/\s+/)
          var tokens = 0
          for (var i = 0; i < rel.length; i += 1) {
            if (!rel[i]) continue
            tokens += 1
            var known = false
            for (var j = 0; j < speculativeRels.length; j += 1) {
              if (rel[i] === speculativeRels[j]) known = true
            }
            if (!known) return false
          }
          return tokens > 0
        }
        // Capture phase, because element load failures fire error events that do not bubble.
        window.addEventListener(
          'error',
          function (event) {
            try {
              if (event.target && event.target !== window && event.target.tagName) {
                // An element carrying data-probe is one the page is asking
                // about rather than depending on. The console looks a client
                // site's favicon up at the three conventional paths and draws a
                // lettered tile when none of them answers, so a 404 there is the
                // fallback doing its job - the visitor sees the tile that was
                // always going to be drawn, and there is no defect to fix. It is
                // still held for the live console, because a probe that starts
                // missing where it used to answer is worth being able to see.
                var address = event.target.src || event.target.href || ''
                if (event.target.hasAttribute('data-probe')) {
                  hold('probe', 'No answer at ' + address, '')
                } else if (speculative(event.target)) {
                  hold('hint', 'Declined ' + address.split('?')[0], '')
                } else if (marketingBeacon(address)) {
                  hold('beacon', 'No answer from ' + address.split('?')[0], '')
                } else {
                  report(
                    'resource',
                    'Failed to load ' + event.target.tagName.toLowerCase() + ': ' + address
                  )
                }
              } else if (muted(event)) {
                var hosts = opaqueHosts()
                hold(
                  'opaque',
                  'A script from another origin threw and the browser withheld it. ' +
                    (hosts.length
                      ? 'Cross-origin scripts on the page carrying no CORS: ' + hosts.join(', ')
                      : 'No script on the page accounts for it.')
                )
              } else {
                report(
                  'uncaught',
                  event.message || describe(event.error),
                  event.error && event.error.stack
                )
              }
            } finally {
              if (!loud) event.preventDefault()
            }
          },
          true
        )
        window.addEventListener('unhandledrejection', function (event) {
          try {
            var reason = event.reason
            report('rejection', describe(reason), reason && reason.stack)
          } finally {
            if (!loud) event.preventDefault()
          }
        })
        // A library writing to these is addressing whoever maintains the site
        // rather than whoever is reading the page, so the message travels to the
        // collector instead of to the visitor's console.
        //
        // Each of these captures its stack where it stands rather than calling
        // something to do it, because a helper would be the frame the strip
        // takes and the wrapper would survive into the test.
        ;['error', 'warn', 'trace'].forEach(function (level) {
          var original = console[level]
          console[level] = function () {
            var where
            try {
              throw new Error('reporter')
            } catch (error) {
              where = error.stack
            }
            report('console', flatten(arguments, 0), callerFrames(where))
            if (loud) original.apply(console, arguments)
          }
        })
        var originalAssert = console.assert
        console.assert = function (condition) {
          if (condition) return
          var where
          try {
            throw new Error('reporter')
          } catch (error) {
            where = error.stack
          }
          report('console', 'Assertion failed: ' + flatten(arguments, 1), callerFrames(where))
          if (loud) originalAssert.apply(console, arguments)
        }
        if (window.fetch) {
          var originalFetch = window.fetch
          window.fetch = function (input) {
            var target = typeof input === 'string' ? input : (input && input.url) || ''
            // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
            if (target.indexOf(endpoint) === 0) return originalFetch.apply(window, arguments)
            return originalFetch.apply(window, arguments).then(
              function (response) {
                if (response.status >= 500) {
                  var where = target.split('?')[0]
                  // A beacon answering 500 is the same thing as one not
                  // answering: somebody else's endpoint, on a request the site
                  // did not make. Reported here it would be the identical
                  // ticket arriving through a different door.
                  if (marketingBeacon(target)) {
                    hold('beacon', 'HTTP ' + response.status + ' from ' + where, '')
                    return response
                  }
                  // A gateway timeout is this site's own proxy giving up on a
                  // slow upstream, which is the policy rather than a break: it
                  // holds a deadline and answers rather than keep a serverless
                  // function open with nothing to say, and the console's feeds
                  // carry the last good figures straight through one and ask
                  // again seconds later. Nobody sees anything. Filed as a
                  // fault it becomes an incident on the board visitors read -
                  // raised by a page only the studio can open, and cleared
                  // before anyone looks at it. That is not a claim worth
                  // making about a client's site being up.
                  //
                  // A second from the same endpoint is a different claim: the
                  // upstream is not merely slow, it is not coming back. That
                  // one is reported, so an outage stays as loud as it was.
                  if (response.status === 504 && !slow[where]) {
                    slow[where] = true
                    hold('slow', 'No answer in time from ' + where, '')
                  } else {
                    report('http', 'HTTP ' + response.status + ' from ' + where)
                  }
                }
                return response
              },
              function (error) {
                // A cancelled request is the page doing its job, not failing
                // at it. Every fetch here is issued under an AbortController
                // that the component aborts as it unmounts, so a reader who
                // navigates or closes the tab while a request is in flight
                // cancels it by definition. The browsers word it differently -
                // Safari says the fetch is aborted, Chrome says the user
                // aborted a request - and the name is the part that is the
                // same, so the name is what is read. Still held for the live
                // console, because a cancellation nobody asked for is worth
                // being able to see.
                if (error && error.name === 'AbortError') {
                  hold('aborted', 'Cancelled ' + target.split('?')[0], '')
                  throw error
                }
                // The same cancellation, worded by the platform instead of by
                // the page, and it arrives without the name that identifies
                // one. A request still in flight when the document goes away
                // is torn down by the browser rather than by any controller,
                // and WebKit calls that a plain `TypeError: Load failed` - so
                // on an iPhone the reader who closes the tab, follows a link
                // out or lets the phone sleep produces a rejection
                // indistinguishable, by its message, from an endpoint that is
                // down.
                //
                // Some of these the page asks for outright: the call desk
                // hands back the number it was holding from its own `pagehide`
                // handler, and onboarding flushes what the client typed, both
                // deliberately issued as the document is dismantled so the work
                // is not lost. A request whose whole purpose is to outlive the
                // page cannot also be evidence the page is broken.
                //
                // `pagehide` is the signal that separates them, and it has
                // always fired before any of this. A rejection after it is the
                // reader leaving; there is no longer anybody on screen to tell,
                // and nothing to fix. Held rather than reported, so the live
                // console still shows it went.
                if (unloading) {
                  hold('aborted', 'Cancelled by leaving ' + target.split('?')[0], '')
                  throw error
                }
                if (marketingBeacon(target)) {
                  hold('beacon', 'No answer from ' + target.split('?')[0], '')
                  throw error
                }
                report(
                  'network',
                  (error && error.message ? error.message : String(error)) +
                    ' fetching ' +
                    target.split('?')[0]
                )
                throw error
              }
            )
          }
        }
      })()
    </script>
    <!--site:analytics-->
    <!-- Traffic analytics. The site key is public by design: it says which
         site a hit belongs to, and the collector accepts it only from this
         site's own origins. Deferred, so nothing on the page waits for it.

         data-ignore names the pages that are not visits. The console is the
         studio's own workspace and it is open all day: it stood for well over a
         third of everything the site recorded, so the traffic figures a
         decision gets made on were mostly the person making the decision. The
         tracker files nothing for those paths - no view, no dwell, no beat - so
         a session spent in there is invisible whether it opened on the console
         or walked in from a public page.

         The status board is the exception the "!" marks, and it stays counted.
         It is open to anyone, it reports on no account, and the home page sends
         readers to it by name, so somebody arriving there is a reader like any
         other. -->
    <script
      src="https://gujgtjqqurildqurpffh.supabase.co/functions/v1/analytics-tracker"
      data-site="%SITE_ANALYTICS_SITE_KEY%"
      data-ignore="/console,/login,!/console/status"
      defer
      crossorigin="anonymous"
    ></script>
    <!--/site:analytics-->
