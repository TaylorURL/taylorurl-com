    <!-- The blog's feed, written at build time from the same route list as the
         sitemap. Site-wide rather than per-route: the prerender reuses this head
         on every page it writes, so a reader can subscribe from wherever they
         happen to have landed. -->
    <!--site:blog-->
    <link rel="alternate" type="application/rss+xml" title="%SITE_FEED_TITLE%" href="/feed.xml" />
    <!--/site:blog-->
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- The browser's own chrome, standing on the ground the page paints under
         it. A meta tag cannot read a custom property, so the two values are
         held here by hand: #f6f6f5 is --paper on the light setting and #0b0c0f
         is --paper on the dark one, both in src/index.css, and a change to
         either token is a change to the line beside it here. -->
    <meta
      name="theme-color"
      data-setting="light"
      media="(prefers-color-scheme: light)"
      content="#f6f6f5"
    />
    <meta
      name="theme-color"
      data-setting="dark"
      media="(prefers-color-scheme: dark)"
      content="#0b0c0f"
    />
    <!-- The reader's light or dark setting, stamped on <html> before the first
         paint so the page never shows one palette and then the other. It reads
         the same key useTheme writes and falls back to the system preference,
         which is what "system" and a first visit both resolve to. Inline and
         synchronous, because a deferred script runs after the paint it exists
         to get ahead of.

         The pair above answers the system preference, which is the wrong
         question to put to a reader who picked a setting rather than following
         one. On any choice but "system" the meta that disagrees is dropped and
         the survivor loses its query, so the chrome tracks the setting the
         document actually carries; on "system" both stay, and the browser
         follows the preference as useTheme's own listener does. -->
    <script>
      ;(function () {
        // Arms the band arrival, which the stylesheet keeps behind this
        // attribute. Hidden is a state only script may ask for: set here, before
        // the first paint, a page whose bundle never arrives is served with
        // nothing on it hidden, and there is no frame where a band is drawn and
        // then taken away again.
        document.documentElement.setAttribute('data-reveal', '')

        var stored = null
        try {
          stored = window.localStorage.getItem('taylorurl_theme')
        } catch (ignored) {}
        var choice = stored === 'light' || stored === 'dark' ? stored : null
        if (!choice && stored === 'system') {
          try {
            choice = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (ignored) {}
        }
        if (!choice) {
          choice = 'light'
        }
        document.documentElement.setAttribute('data-theme', choice)
        if (stored === 'system') return
        var chrome = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = chrome.length - 1; i >= 0; i -= 1) {
          if (chrome[i].getAttribute('data-setting') === choice) {
            chrome[i].removeAttribute('media')
          } else {
            chrome[i].parentNode.removeChild(chrome[i])
          }
        }
      })()
    </script>
    <!-- Every page opens at the top, including one that is reloaded. The
         browser's own habit is to put a reader back where they were, which is
         right for a document and wrong for these pages: they are read from
         their heading down, and the site already returns to the top on every
         navigation, so a reload was the one way to arrive halfway into a page.
         Fragment links are untouched - this governs history restoration, not
         an anchor in the URL. Inline and synchronous, because the restoration
         happens before a module script has run. -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>
    <!--site:adTracking-->
    <!-- Google Analytics, property "TaylorURL Home", the Google Ads account, and
         the Meta Pixel. The property and the ad account are two destinations on
         one tag, which is why there is a second `config` line and no second
         script: the loader below drains the queue, sees both, and fetches each
         destination's configuration itself. They are told different things -
         the property reads the event name and the campaign parameters, the ad
         account reads the action and the value - and `conversion.js` is where
         that split is made.

         The queues and the `gtag` and `fbq` stubs are defined here, synchronously,
         so a hit recorded anywhere on the page is held whether or not its tag
         has arrived. Each tag is a fresh origin worth a connection of its own
         and nothing on the page waits on what either does, so both are fetched
         once the page has loaded, or at the visitor's first touch if that comes
         sooner; everything queued in the meantime is sent the moment they land.
         No page_view is sent to Google from the router: the data stream counts
         browser history changes, which is what every navigation on a
         client-side router produces, so a manual call would count each one a
         second time. The pixel counts only the page it was loaded on, so the
         layout reports every page after the first to it. -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        window.dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', '%SITE_GA_ID%')
      gtag('config', '%SITE_ADS_ID%')
      ;(function () {
        var fbq = (window.fbq = function () {
          if (fbq.callMethod) fbq.callMethod.apply(fbq, arguments)
          else fbq.queue.push(arguments)
        })
        window._fbq = fbq
        fbq.push = fbq
        fbq.loaded = true
        fbq.version = '2.0'
        fbq.queue = []
        fbq('init', '%SITE_META_PIXEL_ID%')
        fbq('track', 'PageView')
      })()
      ;(function () {
        // Google's tag is asked for in CORS mode. Meta's cannot be.
        //
        // A throw inside a script from another origin is muted unless that
        // script was fetched with `crossorigin`: the browser replaces the
        // message with "Script error.", blanks the file, zeroes the line and
        // withholds the error object. Fetched with it, the same throw arrives
        // whole, and that is the difference between a report naming a file and
        // one naming nothing at all.
        //
        // It is set per tag rather than on both, because the attribute is not
        // free - a script fetched in CORS mode whose reply carries no
        // `Access-Control-Allow-Origin` is blocked outright. Asked with an
        // `Origin` header, `googletagmanager.com/gtag/js` reflects the origin
        // back and loads; `connect.facebook.net/en_US/fbevents.js` sends no
        // such header at all and is refused. Both checked in a browser against
        // the live vendors on 2026-09-10.
        //
        // So setting it on Meta's would take the pixel off the site, and it
        // would go the worst way there is: the tag never arrives, nothing
        // throws, and an account recording no events reads exactly like an
        // audience nobody reached. Whoever tidies this into one flag later will
        // find that out from the ads account weeks afterwards.
        var tags = [
          { src: 'https://www.googletagmanager.com/gtag/js?id=%SITE_GA_ID%', cors: true },
          { src: 'https://connect.facebook.net/en_US/fbevents.js', cors: false },
        ]
        // The two addresses above, named where the fault reporter can read
        // them. Each of these libraries goes on to fetch more from its own
        // host, and this list is the only thing that separates a tag this page
        // wrote from one the vendor chained off it.
        window.__siteTags = []
        for (var t = 0; t < tags.length; t += 1) window.__siteTags.push(tags[t].src)
        // What became of each of them. The reporter holds every failure on these
        // two addresses and files none of them itself, because one of them read
        // alone cannot say which of two entirely different things happened. This
        // is where that is decided, once both have answered.
        //
        // Two vendors, two CDNs, nothing in common between them but the reader.
        // One failing while the other arrives is a real absence and files: a
        // library that stopped being served, an address this page got wrong, a
        // policy here refusing one host. Both failing together is not something
        // this site can cause or fix - no deploy takes Google and Meta down in
        // the same instant - and it is the everyday shape of a content blocker,
        // which carries both hosts on one filter list, or of a connection that
        // has gone.
        //
        // #549 quietened the containers Google chains off its own host and left
        // the tag this page writes reporting, on the grounds that the loader is
        // the site's own wiring. That is still right and it still reports. What
        // it could not see from one address is that a blocker does not read
        // addresses, it reads hosts: the chained container and the loader are
        // refused in the same instant off the same list, so the half left loud
        // went on filing the same reader's blocker under a different URL. #558
        // was nine of those in ten hours, off `/start`, against a page that was
        // working and a checkout that was taking payments.
        //
        // What it files is worded exactly as the reporter's own resource branch
        // words it. The collector groups by the message, so a wording of its own
        // here would split one fault into two and start its history over.
        //
        // And the rule above reads what became of a request without ever asking
        // whether the reader was still there while it was outstanding. A script
        // still in flight when the document is taken off the screen is torn down
        // by the system, and the element fires `error` for it exactly as it does
        // for a library that is gone. That is the third thing one tag failing
        // while the other arrived can mean, and it is the everyday shape of a
        // phone: the reader taps through, locks the screen or switches apps, and
        // whatever had not landed yet is cancelled underneath them.
        //
        // It lands on this tag rather than the other for the same reason every
        // recurrence here has. Google's is the heavier of the two and it is the
        // one asked for twice, so the pixel has usually landed while the second
        // ask is still going out - one arrived, one refused, filed. A reader
        // arriving on an ad meets it hardest, because the click parameters take
        // the fast path below and put both asks into the page's first moment,
        // which on a throttled connection is the most contended moment there is
        // and the one a first navigation is most likely to land on top of.
        //
        // The reporter already reads every failed `fetch` this way and holds the
        // ones the reader walked out on. The tag block is the one caller into it
        // that never did, so this keeps the same bookkeeping: where the document
        // stood when a tag was first asked for, read again when the verdict on it
        // is reached. It keeps its own count rather than the reporter's because
        // this block runs first and the reporter does not exist yet at the moment
        // an ask goes out.
        //
        // A page the reader stayed on files exactly as before. That is the
        // report this host is worth having and nothing here narrows it.
        var departures = 0
        function offscreen() {
          return document.visibilityState === 'hidden'
        }
        addEventListener('pagehide', function () {
          departures += 1
        })
        document.addEventListener('visibilitychange', function () {
          if (offscreen()) departures += 1
        })
        var asked = {}
        var answered = {}
        function settle(src, arrived) {
          answered[src] = arrived
          var lost = []
          for (var k = 0; k < tags.length; k += 1) {
            if (!(tags[k].src in answered)) return
            if (!answered[tags[k].src]) lost.push(tags[k].src)
          }
          if (lost.length === tags.length) return
          for (var m = 0; m < lost.length; m += 1) {
            var when = asked[lost[m]]
            if (!when || when.away || offscreen() || departures !== when.left) {
              if (window.__reporter && window.__reporter.hold)
                window.__reporter.hold(
                  'tag',
                  'No answer from ' +
                    lost[m].split('?')[0] +
                    ', asked for across a page the reader left'
                )
              continue
            }
            if (window.__reporter && window.__reporter.file)
              window.__reporter.file('resource', 'Failed to load script: ' + lost[m])
          }
        }
        // Each tag's own address, held against the moment it answers. Read off
        // the loop variable instead, every handler would report whichever tag
        // the loop stopped on.
        function answers(src, arrived) {
          return function () {
            settle(src, arrived)
          }
        }
        // A tag asked for in CORS mode has a second way to fail that has nothing
        // to do with whether the host answered.
        //
        // Only Google's is asked for that way - the comment at the top of this
        // block says why, and it is still right - and the browser holds a CORS
        // reply to a standard no reader controls: no `Access-Control-Allow-Origin`
        // naming this origin and the script is refused, whatever the body was.
        // Meta's tag is not asked for in CORS mode, so nothing is checked and
        // nothing can be refused on it.
        //
        // Anything that answers on the vendor's behalf therefore takes the two
        // tags down separately: a blocker that swaps in its own stub, a filtering
        // proxy returning its notice, an inspecting antivirus re-signing the
        // reply. The stub loads for Meta and is refused for Google, off one
        // substitution, in one instant, for one reader - and that is the exact
        // shape the rule above reads as a real absence. Google's own reply is
        // never the cause: `gtag/js` reflects whatever origin asks, checked from
        // here against every domain this site answers on.
        //
        // So #558's rule was sound and was handed an asymmetry it could not see
        // past. Both hosts refused together is a blocker and holds; this reader's
        // blocker did not refuse both, so it filed - and it would file again on
        // every visit, which is why this fingerprint keeps coming back against a
        // site that is working.
        //
        // Asking again without CORS is what separates the two, and it is worth
        // more than the verdict. A tag refused for its CORS mode alone is a tag
        // this reader can have: it arrives on the second ask, runs, and measures
        // them. Until now it was simply lost, and lost silently, on every reader
        // behind a proxy or an antivirus doing this - readers who block nothing
        // and were never meant to go unmeasured. What the second ask costs is one
        // request, only ever on a tag that already failed.
        //
        // The tag itself is unchanged by how it was fetched. CORS buys the
        // reporter a whole error out of a throw inside the library rather than a
        // blanked "Script error.", and on this second ask that detail is what has
        // already been taken away - so it is the fidelity of a report that is
        // given up here, never the measurement.
        function plainly(tag) {
          return function () {
            fetchTag(tag, false)

        function fetchTag(tag, cors) {

          // and what decides the verdict is whether the reader was there for the
          // whole of it rather than for the last request of it.

          node.addEventListener('error', cors ? plainly(tag) : answers(tag.src, false))
          document.head.appendChild(node)
        }

        var SETTLE_MS = 10000
        var fetched = false
        function fetchTags() {
          if (fetched) return
          fetched = true
          for (var i = 0; i < nudges.length; i += 1) removeEventListener(nudges[i], fetchTags, true)
          for (var j = 0; j < tags.length; j += 1) fetchTag(tags[j], tags[j].cors)
        }
        // A visitor's first touch fetches them - and a scroll counts, so anybody
        // reading rather than glancing has already tripped it. Otherwise they
        // wait until the page has been up long enough that nothing they do can
        // land on the first screen's account. Fetched on `load` they arrived
        // inside the window a rating is taken from, and most of what they carry
        // goes unread on any single visit.
        //
        // The wait is ten seconds rather than three because that window is
        // taken on hardware several times slower than a desk machine, and it
        // stays open for longer there than the tags used to wait. Google's tag
        // alone costs the better part of two hundred milliseconds of blocking
        // time on that hardware, so at three seconds it landed inside the
        // reading on some runs and outside it on others, and the same bytes
        // came back fourteen points apart on two readings of the same page.
        //
        // A visitor who arrived on an ad is the exception, and waiting on them
        // costs the thing the ad was bought for. A click identifier exists only
        // on the address they opened, and the router replaces that address on
        // the first navigation. Fetched ten seconds later the tag reads whatever
        // page they moved to, finds no identifier, and writes no click cookie -
        // so the conversion they make, that visit or three days later, is
        // recorded against nobody. Nothing announces it: an account whose clicks
        // are landing and whose conversions are going unattributed reads exactly
        // like an account whose ads are not working.
        //
        // Which is read off the parameters Google Ads appends rather than off
        // the click identifier alone. `gclid` is the identifier and it is the
        // thing worth having, but it is not the thing that says an ad was
        // clicked: auto-tagging writes it, and a click that arrives without it
        // still carries `gad_source` naming the surface it came from and
        // `gad_campaignid` naming the campaign that paid for it. The report on
        // #558 was one of those - a real reader, on `/start`, off campaign
        // 24232381850, carrying `gad_source=5` and no identifier at all - and
        // the test here read it as organic traffic and made them wait with
        // everybody else.
        //
        // None of the three appears on a visit nobody paid for, so widening the
        // test costs no reader who was not already the exception, and a rating
        // run arrives on the bare address carrying none of them, so it still
        // costs that reading nothing.
        //
        // The wait is what keeps the tag out of the window a performance rating
        // is taken from, and a rating run never arrives on one of these
        // addresses, so this costs that reading nothing at all.
        if (/[?&](gclid|gbraid|wbraid|gad_source|gad_campaignid)=/.test(location.search)) {
          fetchTags()
        } else {
          addEventListener('load', function () {
            setTimeout(fetchTags, SETTLE_MS)
          })
        }
        for (var i = 0; i < nudges.length; i += 1) {
          addEventListener(nudges[i], fetchTags, { capture: true, once: true, passive: true })
        }
      })()
    </script>

        // The recovery is inline in the head and cannot fail to arrive, but if
        // it is somehow not there, nothing is going to retry and nothing is
        // going to file, so the sheet reports for itself as it always did.
        function recovering(target) {
          if (!target || target.tagName !== 'LINK') return false
          if (typeof window.__sheetLost !== 'function') return false
          if (target.hasAttribute('data-sheet')) return true
          return String(target.getAttribute('onerror') || '').indexOf('__sheetLost') === 0
        }
        // Capture phase, because element load failures fire error events that do not bubble.
        window.addEventListener(
          'error',
          function (event) {
            try {
              if (event.target && event.target !== window && event.target.tagName) {
                // An element carrying data-probe is one the page is asking
                // about rather than depending on. The console looks a client
                // site's favicon up at the three conventional paths and draws a
                // lettered tile when none of them answers, so a 404 there is the
                // fallback doing its job - the visitor sees the tile that was
                // always going to be drawn, and there is no defect to fix. It is
                // still held for the live console, because a probe that starts
                // missing where it used to answer is worth being able to see.
                var address = event.target.src || event.target.href || ''
                if (event.target.hasAttribute('data-probe')) {
                  hold('probe', 'No answer at ' + address, '')
                } else if (speculative(event.target)) {
                  hold('hint', 'Declined ' + address.split('?')[0], '')
                } else if (marketingBeacon(address)) {
                  hold('beacon', 'No answer from ' + address.split('?')[0], '')
                } else if (siteTag(address)) {
                  hold('tag', 'No answer from ' + address.split('?')[0], '')
                } else if (recovering(event.target)) {
                  hold('recovering', 'Asking again for ' + address, '')
                } else {
                  report(
                    'resource',
                    'Failed to load ' + event.target.tagName.toLowerCase() + ': ' + address
                  )
                }
              } else if (muted(event)) {
                var hosts = opaqueHosts()
                hold(
                  'opaque',
                  'A script from another origin threw and the browser withheld it. ' +
                    (hosts.length
                      ? 'Cross-origin scripts on the page carrying no CORS: ' + hosts.join(', ')
                      : 'No script on the page accounts for it.')
                )
              } else {
                report(
                  'uncaught',
                  event.message || describe(event.error),
                  event.error && event.error.stack
                )
              }
            } finally {
              if (!loud) event.preventDefault()
            }
          },
          true
        )
        window.addEventListener('unhandledrejection', function (event) {
          try {
            var reason = event.reason
            report('rejection', describe(reason), reason && reason.stack)
          } finally {
            if (!loud) event.preventDefault()
          }
        })
        // A library writing to these is addressing whoever maintains the site
        // rather than whoever is reading the page, so the message travels to the
        // collector instead of to the visitor's console.
        //
        // Each of these captures its stack where it stands rather than calling
        // something to do it, because a helper would be the frame the strip
        // takes and the wrapper would survive into the test.
        ;['error', 'warn', 'trace'].forEach(function (level) {
          var original = console[level]
          console[level] = function () {
            var where
            try {
              throw new Error('reporter')
            } catch (error) {
              where = error.stack
            }
            report('console', flatten(arguments, 0), callerFrames(where))
            if (loud) original.apply(console, arguments)
          }
        })
        var originalAssert = console.assert
        console.assert = function (condition) {
          if (condition) return
          var where
          try {
            throw new Error('reporter')
          } catch (error) {
            where = error.stack
          }
          report('console', 'Assertion failed: ' + flatten(arguments, 1), callerFrames(where))
          if (loud) originalAssert.apply(console, arguments)
        }
        if (window.fetch) {
          var originalFetch = window.fetch
          window.fetch = function (input) {
            var target = typeof input === 'string' ? input : (input && input.url) || ''
            // Reports about the reporter's own request would loop, so the endpoint passes through unwrapped.
            if (target.indexOf(endpoint) === 0) return originalFetch.apply(window, arguments)
            // Where the document stood when this request was asked for, read
            // again against where it stands when the answer fails. Taken here
            // rather than in the handler, because by then the reader is back
            // and everything on screen says the page never went anywhere.
            var leftBefore = departures
            var askedAway = offscreen()
            return originalFetch.apply(window, arguments).then(
              function (response) {
                if (response.status >= 500) {
                  var where = target.split('?')[0]
                  // A beacon answering 500 is the same thing as one not
                  // answering: somebody else's endpoint, on a request the site
                  // did not make. Reported here it would be the identical
                  // ticket arriving through a different door.
                  if (marketingBeacon(target)) {
                    hold('beacon', 'HTTP ' + response.status + ' from ' + where, '')
                    return response
                  }
                  // A gateway timeout is this site's own proxy giving up on a
                  // slow upstream, which is the policy rather than a break: it
                  // holds a deadline and answers rather than keep a serverless
                  // function open with nothing to say, and the console's feeds
                  // carry the last good figures straight through one and ask
                  // again seconds later. Nobody sees anything. Filed as a
                  // fault it becomes an incident on the board visitors read -
                  // raised by a page only the studio can open, and cleared
                  // before anyone looks at it. That is not a claim worth
                  // making about a client's site being up.
                  //
                  // A second from the same endpoint is a different claim: the
                  // upstream is not merely slow, it is not coming back. That
                  // one is reported, so an outage stays as loud as it was.
                  if (response.status === 504 && !slow[where]) {
                    slow[where] = true
                    hold('slow', 'No answer in time from ' + where, '')
                  } else {
                    report('http', 'HTTP ' + response.status + ' from ' + where)
                  }
                }
                return response
              },
              function (error) {
                // A cancelled request is the page doing its job, not failing
                // at it. Every fetch here is issued under an AbortController
                // that the component aborts as it unmounts, so a reader who
                // navigates or closes the tab while a request is in flight
                // cancels it by definition. The browsers word it differently -
                // Safari says the fetch is aborted, Chrome says the user
                // aborted a request - and the name is the part that is the
                // same, so the name is what is read. Still held for the live
                // console, because a cancellation nobody asked for is worth
                // being able to see.
                if (error && error.name === 'AbortError') {
                  hold('aborted', 'Cancelled ' + target.split('?')[0], '')
                  throw error
                }
                // The same cancellation, worded by the platform instead of by
                // the page, and it arrives without the name that identifies
                // one. A request still in flight when the document goes away
                // is torn down by the browser rather than by any controller,
                // and WebKit calls that a plain `TypeError: Load failed` - so
                // on an iPhone the reader who closes the tab, follows a link
                // out or lets the phone sleep produces a rejection
                // indistinguishable, by its message, from an endpoint that is
                // down.
                //
                // Some of these the page asks for outright: the call desk
                // hands back the number it was holding from its own `pagehide`
                // handler, and onboarding flushes what the client typed, both
                // deliberately issued as the document is dismantled so the work
                // is not lost. A request whose whole purpose is to outlive the
                // page cannot also be evidence the page is broken.
                //
                // Leaving is the signal that separates them, and reading it off
                // `unloading` alone missed two thirds of it. That flag is true
                // only while the document is away, and a rejection cannot be
                // delivered while the document is away: a frozen page runs no
                // handlers, so the failure surfaces on the way back, after
                // `pageshow` has already put the flag down. And a backgrounded
                // phone hides the tab without firing `pagehide` at all, which
                // is the state the call desk deliberately keeps working in -
                // it goes on saying it is here while it holds a number, so a
                // suspended web view kills its request and nothing else's.
                // That is why one endpoint on this whole site kept arriving as
                // a fault while it was answering every other request put to it.
                //
                // So the question is asked over the life of the request rather
                // than at the end of it: a document that was away when this was
                // asked for, or is away now, or left and came back in between,
                // did not get an answer because it was not there to receive
                // one. A request that began on screen, stayed on screen and
                // failed anyway is a real failure and still reports. Held
                // rather than reported, so the live console still shows it
                // went.
                if (unloading || askedAway || offscreen() || departures !== leftBefore) {
                  hold('aborted', 'Cancelled by leaving ' + target.split('?')[0], '')
                  throw error
                }
                if (marketingBeacon(target)) {
                  hold('beacon', 'No answer from ' + target.split('?')[0], '')
                  throw error
                }
                report(
                  'network',
                  (error && error.message ? error.message : String(error)) +
                    ' fetching ' +
                    target.split('?')[0]
                )
                throw error
              }
            )
          }
        }
      })()
    </script>
    <!--site:analytics-->
    <!-- Traffic analytics. The site key is public by design: it says which
         site a hit belongs to, and the collector accepts it only from this
         site's own origins. Deferred, so nothing on the page waits for it.

         data-ignore names the pages that are not visits. The console is the
         studio's own workspace and it is open all day: it stood for well over a
         third of everything the site recorded, so the traffic figures a
         decision gets made on were mostly the person making the decision. The
         tracker files nothing for those paths - no view, no dwell, no beat - so
         a session spent in there is invisible whether it opened on the console
         or walked in from a public page.

         The status board is the exception the "!" marks, and it stays counted.
         It is open to anyone, it reports on no account, and the home page sends
         readers to it by name, so somebody arriving there is a reader like any
         other. -->
    <script
      src="https://gujgtjqqurildqurpffh.supabase.co/functions/v1/analytics-tracker"
      data-site="%SITE_ANALYTICS_SITE_KEY%"
      data-ignore="/console,/login,!/console/status"
      defer
      crossorigin="anonymous"
    ></script>
    <!--/site:analytics-->
