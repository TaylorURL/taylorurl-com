name: Portfolio captures

# A portfolio preview is the one asset on this site whose truth lives somewhere
# else. A client redesigns, swaps a hero image, or lets a page drift, and the
# committed shot keeps showing whatever was true the day it was taken with
# nothing in the repository to say so. This recaptures every entry on a schedule
# and opens a pull request when a shot has moved, so a stale preview is caught by
# the run rather than by a visitor holding the page against the live site.
#
# The shots are rendered by thum.io, the same service the portfolio already
# falls back to, so no browser runs here.

on:
  schedule:
    # Every night, so a day of client changes is picked up before anyone is
    # looking at the site. GitHub reads this field as UTC and has no notion of
    # a timezone, so the hour is written for 1am Central on daylight time and
    # lands at midnight Central through the winter.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: portfolio-captures
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the WebP encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Check the portfolio against the live sites
        run: npm run audit:portfolio
      - name: Recapture every preview
        run: npm run capture:portfolio
      - name: Land whatever moved
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- public/portfolio; then
            echo "Every preview still matches its live site."
            exit 0
          fi
          moved=$(git diff --name-only -- public/portfolio | wc -l | tr -d ' ')
          branch="portfolio-captures/$(date -u +%Y-%m-%d)"
          # Pinned rather than copied off the branch. Reading the last author
          # makes this run inherit whatever identity landed most recently, so a
          # single commit under the wrong name turns into every commit this
          # workflow writes from then on.
          git config user.name "Trenton Taylor"
          git config user.email "trenton.taylor.email@gmail.com"
          git checkout -b "$branch"
          # Every pull request into develop carries one version step, which the
          # CI gate enforces, so the run takes it here rather than leaving a
          # branch that cannot merge.
          node -e '
            const fs = require("node:fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const parts = pkg.version.split(".")
            parts[parts.length - 1] = String(Number(parts[parts.length - 1]) + 1)
            pkg.version = parts.join(".")
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
            if (fs.existsSync("public/release.json")) {
              const rel = JSON.parse(fs.readFileSync("public/release.json", "utf8"))
              rel.version = pkg.version
              fs.writeFileSync("public/release.json", JSON.stringify(rel, null, 2) + "\n")
            }
            if (fs.existsSync("README.md")) {
              const text = fs.readFileSync("README.md", "utf8")
              fs.writeFileSync("README.md", text.replace(/version-[0-9][0-9.]*-/g, "version-" + pkg.version + "-"))
            }
            console.log(pkg.version)
          '
          git add -A
          git commit -m "Refresh the portfolio previews that moved" -m "${moved} committed shot(s) no longer matched the live site."
          git push -u origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "Refresh the portfolio previews that moved" \
            --body "${moved} committed preview(s) no longer matched the live site, and were recaptured on the nightly run."
          gh pr merge "$branch" --auto --squash --delete-branch
